<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LogiControl — Tópicos Avançados</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--line:#e4e9f0;--brand:#173b7a;--brand2:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}.side{width:250px;background:#102a56;color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:22px;font-weight:800;margin-bottom:4px}.sub{font-size:11px;color:#c8d6ef;margin-bottom:24px}.nav button{display:block;width:100%;border:0;background:transparent;color:#dce7f8;text-align:left;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#1e4d92;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.mobile{display:none}.badge{background:#fff3cd;color:#7a5200;border:1px solid #f1d98a;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 14px #102a5608}.kpi b{font-size:29px;display:block;margin-top:7px}.muted{color:var(--muted);font-size:13px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;outline:none}.toolbar input{min-width:230px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--brand2);color:white;font-weight:700}.btn.secondary{background:#e8eef8;color:var(--brand)}.btn.danger{background:#fee2e2;color:#991b1b}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f7f9fc;color:#566174}.pill{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.bar{height:10px;background:#edf1f7;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2);border-radius:8px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding:15px 5px}.barcol{flex:1;text-align:center;font-size:11px;color:var(--muted)}.barcol i{display:block;width:100%;background:#3b82f6;border-radius:7px 7px 0 0;margin-bottom:7px}.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.step{padding:15px;border:1px solid var(--line);border-radius:12px}.step strong{display:block;margin-bottom:6px}.hidden{display:none!important}.presentation{position:fixed;inset:0;background:#071a36;color:#fff;z-index:20;padding:8vh 10vw;overflow:auto}.presentation h1{font-size:48px;margin:0 0 15px}.presentation h2{font-size:30px}.presentation p,.presentation li{font-size:20px;line-height:1.55;color:#dce7f8}.presnav{position:fixed;bottom:25px;right:30px;display:flex;gap:8px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30}.modalbox{background:#fff;border-radius:16px;padding:22px;width:min(520px,92vw)}.form{display:grid;gap:10px}.form textarea{min-height:90px}.footer{margin-top:22px;color:#7a8494;font-size:12px}
@media(max-width:900px){.side{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:680px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin:0;width:100%;padding:16px}.mobile{display:inline-flex}.grid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}.top h1{font-size:21px}.table{display:block;overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand">LogiControl</div><div class="sub">Tópicos Avançados • protótipo</div>
<nav class="nav">
<button onclick="go('dashboard')" class="active">▣ Dashboard</button><button onclick="go('operacoes')">▤ Operações</button><button onclick="go('ocorrencias')">⚠ Ocorrências</button><button onclick="go('seguranca')">✓ Segurança</button><button onclick="go('indicadores')">◒ Indicadores</button><button onclick="go('plano')">☷ Plano de Ação</button><button onclick="go('projeto')">◎ Sobre o Projeto</button><button onclick="startPresentation()">▶ Modo Apresentação</button>
</nav></aside>
<main class="main"><div class="top"><div><button class="btn secondary mobile" onclick="toggleMenu()">☰</button> <h1 id="title" style="display:inline">Dashboard</h1></div><span class="badge">SIMULAÇÃO ACADÊMICA • DADOS FICTÍCIOS</span></div>
<div id="content"></div><div class="footer">LogiVia Operações Integradas Ltda. — identidade acadêmica fictícia; informações baseadas em pesquisa pública.</div></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Novo registro</h2><button class="btn secondary" onclick="closeModal()">Fechar</button></div><div class="form" id="form"></div></div></div>
<div id="pres" class="presentation hidden"><div id="presbody"></div><div class="presnav"><button class="btn secondary" onclick="prevSlide()">←</button><button class="btn secondary" onclick="nextSlide()">→</button><button class="btn" onclick="endPresentation()">Sair</button></div></div>
<script>
const data={
ops:[['OP-1042','Rota Norte','Em andamento','Alta'],['OP-1043','Rota Sul','Planejada','Média'],['OP-1044','Transferência CD','Concluída','Baixa'],['OP-1045','Rota Centro','Em andamento','Alta']],
occ:[['OC-021','Atraso operacional','OP-1042','Em análise'],['OC-022','Falha em checklist','OP-1044','Resolvida'],['OC-023','Avaria de embalagem','OP-1045','Aberta']],
checks:[['Veículos','18/20','90%'],['EPIs','46/50','92%'],['Documentação','24/25','96%']]
};
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const btn=[...document.querySelectorAll('.nav button')].find(b=>b.getAttribute('onclick')?.includes("'"+page+"'"));if(btn)btn.classList.add('active');document.getElementById('side').classList.remove('open');const c=document.getElementById('content');const t=document.getElementById('title');
if(page==='dashboard'){t.textContent='Dashboard';c.innerHTML=dashboard()}
if(page==='operacoes'){t.textContent='Operações';c.innerHTML=tablePage('Operações',data.ops,['Código','Processo','Status','Prioridade'],'op')}
if(page==='ocorrencias'){t.textContent='Ocorrências';c.innerHTML=tablePage('Ocorrências',data.occ,['Código','Tipo','Referência','Status'],'occ')}
if(page==='seguranca'){t.textContent='Segurança';c.innerHTML=security()}
if(page==='indicadores'){t.textContent='Indicadores';c.innerHTML=indicators()}
if(page==='plano'){t.textContent='Plano de Ação';c.innerHTML=plan()}
if(page==='projeto'){t.textContent='Sobre o Projeto';c.innerHTML=project()}
}
function dashboard(){return '<div class="grid"><div class="card kpi"><span class="muted">Operações</span><b>24</b><span class="pill ok">92% no fluxo</span></div><div class="card kpi"><span class="muted">Ocorrências abertas</span><b>03</b><span class="pill warn">2 prioritárias</span></div><div class="card kpi"><span class="muted">Conformidade</span><b>94%</b><span class="pill ok">+4 p.p.</span></div><div class="card kpi"><span class="muted">Ações pendentes</span><b>07</b><span class="pill bad">3 vencendo</span></div></div><div class="cols section"><div class="card"><h2>Fluxo operacional</h2><div class="chart">'+[['Seg',70],['Ter',88],['Qua',62],['Qui',91],['Sex',76],['Sáb',55]].map(x=>'<div class="barcol"><i style="height:'+x[1]+'%"></i>'+x[0]+'</div>').join('')+'</div></div><div class="card"><h2>Prioridades</h2><p>Alta <span style="float:right">6</span></p><div class="bar"><i style="width:70%"></i></div><p>Média <span style="float:right">11</span></p><div class="bar"><i style="width:52%"></i></div><p>Baixa <span style="float:right">7</span></p><div class="bar"><i style="width:32%"></i></div></div></div><div class="section card"><h2>Próximas ações</h2><div class="steps"><div class="step"><strong>Revisar checklist</strong><span class="muted">Responsável: Operações • prioridade alta</span></div><div class="step"><strong>Tratar ocorrência OC-023</strong><span class="muted">Responsável: Segurança • prazo próximo</span></div></div></div>'}
function tablePage(title,rows,heads,type){return '<div class="toolbar"><input id="search" placeholder="Pesquisar..." oninput="filterTable()"><select id="filter" onchange="filterTable()"><option>Todos</option><option>Alta</option><option>Média</option><option>Baixa</option><option>Aberta</option><option>Resolvida</option><option>Em análise</option></select><button class="btn" onclick="openForm(\''+type+'\')">+ Novo registro</button></div><div class="card"><table class="table" id="tbl"><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((v,i)=>'<td>'+((v==='Alta'||v==='Aberta')?'<span class="pill bad">'+v+'</span>':(v==='Média'||v==='Em análise')?'<span class="pill warn">'+v+'</span>':(v==='Baixa'||v==='Resolvida'||v==='Concluída')?'<span class="pill ok">'+v+'</span>':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function filterTable(){const q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'Todos';document.querySelectorAll('#tbl tbody tr').forEach(r=>{const s=r.innerText.toLowerCase();r.style.display=(s.includes(q)&&(f==='Todos'||s.includes(f.toLowerCase())))?'':'none'})}
function security(){return '<div class="grid">'+data.checks.map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b style="font-size:28px;display:block;margin:7px 0">'+x[2]+'</b><div class="bar"><i style="width:'+x[2]+'"></i></div><small>'+x[1]+' itens verificados</small></div>').join('')+'</div><div class="section card"><h2>Rotina de segurança</h2><ul><li>Checklist antes da operação</li><li>Registro de não conformidades</li><li>Acompanhamento de ações corretivas</li><li>Consolidação de indicadores</li></ul></div>'}
function indicators(){return '<div class="grid"><div class="card kpi"><span class="muted">SLA operacional</span><b>91%</b></div><div class="card kpi"><span class="muted">Ocorrências tratadas</span><b>87%</b></div><div class="card kpi"><span class="muted">Checklists</span><b>94%</b></div><div class="card kpi"><span class="muted">Ações concluídas</span><b>78%</b></div></div><div class="section card"><h2>Indicadores para decisão</h2><table class="table"><tr><th>Indicador</th><th>Valor simulado</th><th>Uso</th></tr><tr><td>Conformidade de checklist</td><td>94%</td><td>Prevenção</td></tr><tr><td>Tempo médio de tratamento</td><td>18 h</td><td>Priorização</td></tr><tr><td>Operações dentro do prazo</td><td>91%</td><td>Desempenho</td></tr></table></div>'}
function plan(){return '<div class="toolbar"><button class="btn" onclick="openForm(\'action\')">+ Nova ação</button></div><div class="card"><table class="table"><tr><th>Ação</th><th>Responsável</th><th>Prioridade</th><th>Status</th></tr><tr><td>Padronizar checklist</td><td>Segurança</td><td><span class="pill bad">Alta</span></td><td>Em andamento</td></tr><tr><td>Centralizar registros</td><td>Operações</td><td><span class="pill warn">Média</span></td><td>Planejada</td></tr><tr><td>Revisar indicadores</td><td>Gestão</td><td><span class="pill ok">Baixa</span></td><td>Concluída</td></tr></table></div>'}
function project(){return '<div class="card"><h2>Projeto acadêmico</h2><p><b>Empresa simulada:</b> LogiVia Operações Integradas Ltda.</p><p><b>Desafio:</b> informações operacionais, ocorrências e verificações de segurança distribuídas em planilhas, mensagens e registros manuais.</p><p><b>Proposta:</b> LogiControl, protótipo para centralização, acompanhamento, priorização e indicadores.</p><h2>Plan • Planejamento</h2><p>Pesquisa pública, definição da investigação e preparação das perguntas estratégicas.</p><h2>Do • Execução</h2><p>Análise das fontes públicas, organização das informações e registro das evidências utilizadas.</p><div class="card" style="background:#fff8db;border-color:#efd98a"><b>Importante:</b> este protótipo é um estudo de caso acadêmico. Nenhum dado simulado representa indicador ou resposta real da empresa.</div></div>'}
function toggleMenu(){document.getElementById('side').classList.toggle('open')}
function openForm(type){document.getElementById('modal').classList.remove('hidden');document.getElementById('modalTitle').textContent=type==='action'?'Nova ação':type==='occ'?'Nova ocorrência':'Novo registro';document.getElementById('form').innerHTML='<input placeholder="Título/descrição"><select><option>Alta</option><option>Média</option><option>Baixa</option></select><textarea placeholder="Observações"></textarea><button class="btn" onclick="saveForm()">Salvar registro</button>'}
function closeModal(){document.getElementById('modal').classList.add('hidden')}function saveForm(){closeModal();alert('Registro demonstrativo salvo nesta sessão.');}
const slides=[['LogiControl','Tópicos Avançados em Administração'],['Contexto','Empresa acadêmica fictícia baseada em pesquisa pública. O objetivo é demonstrar uma solução digital sem inventar entrevista ou visita.'],['Problema','Operações, ocorrências e verificações de segurança podem ficar dispersas em planilhas, mensagens e registros manuais.'],['Investigação','Na pesquisa: analisar fontes públicas, organizar evidências e aplicar até seis perguntas-guia ao estudo do processo.'],['Solução','LogiControl centraliza operações, ocorrências, segurança, indicadores e plano de ação.'],['Protótipo','Dashboard → Operações → Ocorrências → Segurança → Indicadores → Plano de Ação.'],['Benefícios esperados','Mais visibilidade, priorização, rastreabilidade e apoio à tomada de decisão.'],['Conclusão','Problema identificado → investigação → planejamento → solução proposta → protótipo demonstrável.']];
let si=0;function startPresentation(){si=0;document.getElementById('pres').classList.remove('hidden');renderSlide()}function renderSlide(){const s=slides[si];document.getElementById('presbody').innerHTML='<div class="muted">LOGICONTROL • SLIDE '+(si+1)+'/'+slides.length+'</div><h1>'+s[0]+'</h1><p>'+s[1]+'</p>'}function nextSlide(){if(si<slides.length-1){si++;renderSlide()}}function prevSlide(){if(si>0){si--;renderSlide()}}function endPresentation(){document.getElementById('pres').classList.add('hidden')}
go('dashboard');
</script></body></html>
